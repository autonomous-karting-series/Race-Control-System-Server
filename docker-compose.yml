version: '3.8'

services:

  mosquitto:
    container_name: rcs-broker
    image: eclipse-mosquitto:2
    tty: true
    stdin_open: true
    restart: always
    volumes:
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/log:/mosquitto/log
      - ./mosquitto/data:/mosquitto/data
    ports:
      - 1883:1883
      # - 9001:9001 # Websocket support

